<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; color: #1f2933; max-width: 560px; margin: 0 auto;">
    <p>Hi {{ name }},</p>
    <p>Someone asked to reset the password for your {{ app_name }} account. If it was you, use the button below. The link works for {{ expires_minutes }} minutes.</p>
    <p><a href="{{ reset_url }}" style="background: #2563eb; color: #ffffff; padding: 10px 18px; text-decoration: none; border-radius: 4px;">Reset password</a></p>
    <p>If you did not ask for this, you can ignore this email. Your password stays the same.</p>
  </body>
</html>
